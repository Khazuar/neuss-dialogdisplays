# SPDX-License-Identifier: MIT
name: Pages

# Erzeugt CSV und YAML aus den DSD-Dateien und veroeffentlicht die YAML-Auswertungen
# (plus summary.csv fuer die Tabelle) zusammen mit site/index.html per GitHub Pages.
# Die Einzelmessungen als CSV (rund 270 MB) gibt es nur im Release (release.yml).
# Die abgeleiteten Daten liegen nie im Repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: numpy fuer die Verhaltensgruppen (verhalten.py)
        run: python -m pip install numpy
      - name: Tests (Zeitumrechnung, Uhr-Auswertung)
        run: python -m unittest -v
      - name: Zwischenspeicher der Ergebnisse je Datei laden
        uses: actions/cache@v4
        with:
          path: .zwischenspeicher
          key: ergebnisse-${{ github.sha }}
          restore-keys: ergebnisse-
      - name: YAML und Zellen aus den DSD-Dateien erzeugen (ohne CSV je Datei)
        run: python -I dsd2csv.py . -o _site --keine-csv --cache .zwischenspeicher --jobs 4 --aggregat _aggregat
      - name: Bereinigte Daten als CSV (Kennzahlen, Tage, Stunden)
        run: python -I daten_bauen.py --auswertung _site/auswertung.json --aggregat _aggregat --ziel _site/daten
      - name: Verhaltensgruppen auf Standort- und Stadtebene
        run: python -I stadtgruppen.py --auswertung _site/auswertung.json
      - name: Detailseiten der Standorte bauen
        run: python -I seiten_bauen.py --auswertung _site/auswertung.json --ziel _site
      - name: Seiten hinzufuegen
        run: cp site/index.html site/datenschutz.html site/style.css site/filter.js site/seite.js site/labor.js site/llms.txt DATEN.md _site/
      - name: Impressum aus den Repository-Variablen erzeugen
        env:
          IMPRESSUM_STRASSE: ${{ vars.IMPRESSUM_STRASSE }}
          IMPRESSUM_ORT: ${{ vars.IMPRESSUM_ORT }}
          IMPRESSUM_TELEFON: ${{ vars.IMPRESSUM_TELEFON }}
        run: python site/impressum_bauen.py site/impressum.html _site/impressum.html
      - name: robots.txt, Sitemap und feste Tabelle fuer Abrufer ohne JavaScript
        run: python -I seo_bauen.py --ziel _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
