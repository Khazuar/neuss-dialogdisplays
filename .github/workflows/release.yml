# SPDX-License-Identifier: MIT
name: Release

# Bei einem Tag v* wird ein Release mit allen abgeleiteten Daten (CSV + YAML) als ZIP angelegt.
#   git tag v1.0 && git push origin v1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CSV und YAML aus den DSD-Dateien erzeugen
        run: python -I dsd2csv.py . -o daten
      - name: Datenlizenz beilegen
        run: cp LICENSE-DATEN daten/LICENSE-DATEN
      - name: ZIP packen
        run: zip -r -q "neuss-dialogdisplays-daten-${GITHUB_REF_NAME}.zip" daten
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "neuss-dialogdisplays-daten-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
